name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || true
          xcodebuild -version

      - name: Generate app icon
        run: python3 scripts/make_icon.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project CookieStudio.xcodeproj \
            -scheme CookieStudio \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Show compile errors (summary)
        if: failure()
        run: |
          grep -E "error:" "$RUNNER_TEMP/xcodebuild.log" | sort -u | while read -r line; do
            echo "::error::$line"
          done || true

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/CookieStudio.app"
          test -d "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/CookieStudio.app
          cd build
          /usr/bin/zip -qry CookieStudio.ipa Payload
          test -s CookieStudio.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CookieStudio-unsigned-ipa
          path: build/CookieStudio.ipa
          if-no-files-found: error
          retention-days: 14
